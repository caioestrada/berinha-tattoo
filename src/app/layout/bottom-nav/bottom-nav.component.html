<nav class="bottom-nav">
  <a
    class="bottom-nav__item"
    routerLink="/"
    routerLinkActive="is-active"
    [routerLinkActiveOptions]="{ exact: true }"
    #home="routerLinkActive"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" [attr.stroke]="home.isActive ? 'var(--color-gold)' : 'var(--color-text-muted)'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-5H9v5H4a1 1 0 01-1-1z" />
    </svg>
    <span class="bottom-nav__label" [class.is-active]="home.isActive">Home</span>
  </a>

  <a class="bottom-nav__item" routerLink="/portfolio" routerLinkActive="is-active" #portfolio="routerLinkActive">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" [attr.stroke]="portfolio.isActive ? 'var(--color-gold)' : 'var(--color-text-muted)'" stroke-width="1.8" stroke-linecap="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
    </svg>
    <span class="bottom-nav__label" [class.is-active]="portfolio.isActive">Portfólio</span>
  </a>

  <a class="bottom-nav__item bottom-nav__item--cta" routerLink="/agendar" routerLinkActive="is-active" #agendar="routerLinkActive">
    <span class="bottom-nav__cta-badge">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0c0b09" stroke-width="2.5" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="17" rx="2.5" />
        <line x1="3" y1="9" x2="21" y2="9" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="16" y1="2" x2="16" y2="6" />
      </svg>
    </span>
    <span class="bottom-nav__label" [class.is-active]="agendar.isActive">Agendar</span>
  </a>

  <a class="bottom-nav__item" routerLink="/sobre" routerLinkActive="is-active" #sobre="routerLinkActive">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" [attr.stroke]="sobre.isActive ? 'var(--color-gold)' : 'var(--color-text-muted)'" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
    </svg>
    <span class="bottom-nav__label" [class.is-active]="sobre.isActive">Sobre</span>
  </a>
</nav>
