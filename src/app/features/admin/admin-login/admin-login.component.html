<section class="admin-login">
  <a class="admin-login__back" routerLink="/" aria-label="Voltar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(245,240,232,.6)" stroke-width="2.5" stroke-linecap="round">
      <polyline points="15,18 9,12 15,6" />
    </svg>
  </a>

  <div class="admin-login__content">
    <div class="admin-login__icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2" />
        <path d="M8 10V7a4 4 0 018 0v3" />
      </svg>
    </div>
    <h1 class="admin-login__title">Acesso administrativo</h1>
    <p class="admin-login__subtitle">Entre com a senha para gerenciar os agendamentos</p>

    <form class="admin-login__form" (submit)="$event.preventDefault(); submit()">
      <input
        class="admin-login__input"
        [class.is-error]="error()"
        type="password"
        placeholder="Senha"
        autofocus
        [value]="password()"
        (input)="onPasswordInput($any($event.target).value)"
      />
      @if (error()) {
        <p class="admin-login__error">Senha incorreta. Tente novamente.</p>
      }

      <button type="submit" class="btn-primary" [disabled]="!password()">Entrar</button>
    </form>
  </div>
</section>
