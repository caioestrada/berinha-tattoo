<section class="home">
  <div class="home__hero" [style.background-image]="'url(images/portfolio/nossa-senhora.jpg)'">
    <div class="home__hero-actions">
      <a
        class="home__hero-icon"
        href="https://www.instagram.com/berinhatattoo/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f5f0e8" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="17.5" cy="6.5" r="1.2" fill="#f5f0e8" />
        </svg>
      </a>
      <a class="home__hero-icon" routerLink="/admin/login" aria-label="Acesso administrativo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f5f0e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </a>
    </div>
    <div class="home__hero-content">
      <a class="home__handle" href="https://www.instagram.com/berinhatattoo/" target="_blank" rel="noopener noreferrer"
        >&#64;berinha.tattoo</a
      >
      <h1 class="home__title">BERINHA</h1>
      <p class="home__subtitle">Tatuador · Realismo · São Paulo</p>
    </div>
  </div>

  <div class="home__cta">
    <a class="btn-primary" routerLink="/agendar">Agendar minha tattoo</a>
    <a class="btn-secondary" routerLink="/portfolio">Ver portfólio</a>
  </div>

  <div class="home__stats">
    @for (stat of stats; track stat.label) {
      <div class="home__stat">
        <div class="home__stat-value">{{ stat.value }}</div>
        <div class="home__stat-label">{{ stat.label }}</div>
      </div>
    }
  </div>

  <div class="home__recent">
    <div class="section-label" style="margin-bottom: 12px;">Trabalhos recentes</div>
    <div class="home__recent-grid">
      @for (item of recentWork(); track item.id) {
        <div class="home__recent-tile">
          <app-placeholder-image [label]="'foto'" [seed]="item.seed" [image]="item.image" />
        </div>
      }
    </div>
  </div>
</section>
