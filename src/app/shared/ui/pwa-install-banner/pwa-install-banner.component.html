@if (pwaInstall.canShowBanner()) {
  <div class="pwa-banner" role="dialog" aria-label="Instalar aplicativo">
    <img class="pwa-banner__icon" src="icons/icon-72x72.png" alt="" width="36" height="36" />
    <div class="pwa-banner__text">
      <strong>Instale o app da Berinha</strong>
      @if (pwaInstall.isIos) {
        <span>Toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</span>
      } @else {
        <span>Acesso rápido, direto da sua tela inicial.</span>
      }
    </div>
    <div class="pwa-banner__actions">
      @if (!pwaInstall.isIos) {
        <button type="button" class="pwa-banner__install" (click)="install()">Instalar</button>
      }
      <button type="button" class="pwa-banner__dismiss" (click)="dismiss()" aria-label="Fechar">✕</button>
    </div>
  </div>
}
